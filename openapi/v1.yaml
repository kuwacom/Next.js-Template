openapi: 3.0.3
info:
  title: Sample API
  description: A simple example API
  version: 1.0.0
servers:
  - url: http://localhost:3000/api/v1
  - url: https://api.example.com/v1
paths:
  /forms/contact:
    post:
      summary: Submit a contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactFormRequest'
      responses:
        '200':
          description: Contact form submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionResult'
        '400':
          description: Validation or Turnstile verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionResult'
        '500':
          description: Server or configuration error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactSubmissionResult'
  /users:
    get:
      summary: Get a list of users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /users/{userId}:
    get:
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (invalid ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Updated user object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad request (invalid ID or missing fields)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResponse'
        '400':
          description: Bad request (invalid ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ContactFormRequest:
      type: object
      properties:
        company:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        locale:
          type: string
          enum:
            - en
            - ja
        message:
          type: string
          minLength: 10
          maxLength: 2000
        name:
          type: string
          minLength: 1
          maxLength: 80
        pagePath:
          type: string
          minLength: 1
        turnstileToken:
          type: string
          minLength: 1
      required:
        - company
        - email
        - locale
        - message
        - name
        - pagePath
        - turnstileToken
    ContactFieldErrors:
      type: object
      properties:
        company:
          type: string
        email:
          type: string
        message:
          type: string
        name:
          type: string
        turnstileToken:
          type: string
    ContactSubmissionStatus:
      type: string
      enum:
        - config_error
        - server_error
        - success
        - turnstile_error
        - validation_error
    ContactSubmissionResult:
      type: object
      properties:
        fieldErrors:
          $ref: '#/components/schemas/ContactFieldErrors'
        message:
          type: string
        ok:
          type: boolean
        resetTurnstile:
          type: boolean
        status:
          $ref: '#/components/schemas/ContactSubmissionStatus'
        turnstileErrors:
          type: array
          items:
            type: string
      required:
        - fieldErrors
        - message
        - ok
        - resetTurnstile
        - status
        - turnstileErrors
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
      required:
        - id
        - name
        - email
    UserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
      required:
        - name
        - email
    DeleteUserResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - message
        - user
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - UNAUTHORIZED
            - FORBIDDEN
            - CONFLICT
            - INTERNAL_SERVER_ERROR
        message:
          type: string
          example: User not found
        details:
          description: バリデーションエラーの詳細など
      required:
        - code
        - message
